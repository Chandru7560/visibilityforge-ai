services:
  - type: web
    name: visibilityforge-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run.py db upgrade && flask --app run.py bootstrap-admin && gunicorn --bind 0.0.0.0:$PORT --access-logfile - --error-logfile - "app:create_app()"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: visibilityforge-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OWNER_EMAIL
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false

databases:
  - name: visibilityforge-db
    databaseName: visibilityforge
    user: visibilityforge
    plan: free
